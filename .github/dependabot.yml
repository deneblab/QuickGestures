version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]

  # Fallout build project
  - package-ecosystem: "nuget"
    directory: "/src/build"
    schedule:
      interval: "weekly"
    groups:
      nuget:
        patterns: ["*"]
