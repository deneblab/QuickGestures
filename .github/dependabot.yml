version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Follows the Node.js LTS used by the workflows (lts/*), bumped by hand when a new LTS starts
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]

  # Fallout build project
  - package-ecosystem: "nuget"
    directory: "/src/build"
    schedule:
      interval: "weekly"
    groups:
      nuget:
        patterns: ["*"]
