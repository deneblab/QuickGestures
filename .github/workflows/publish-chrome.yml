name: Publish to Chrome Web Store

# Manual only. A release created by release.yml cannot trigger this workflow
# (events from GITHUB_TOKEN do not start other workflows), so a "release"
# trigger would never fire.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.3.8 (empty = latest release)"
        required: false
        default: ""
        type: string
      target:
        description: "review = upload and submit for review (goes live after approval); draft = upload only"
        required: true
        default: "review"
        type: choice
        options:
          - review
          - draft

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      TAG: ${{ inputs.tag }}
      TARGET: ${{ inputs.target }}

    steps:
      - name: Check Chrome Web Store secrets
        run: |
          MISSING=()
          for name in CLIENT_ID CLIENT_SECRET REFRESH_TOKEN EXTENSION_ID PUBLISHER_ID; do
            if [ -z "${!name}" ]; then
              MISSING+=("CWS_$name")
            fi
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${MISSING[*]}"
            echo "Add them in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Download release asset (tag)
        if: inputs.tag != ''
        uses: robinraju/release-downloader@v1.13
        with:
          tag: ${{ inputs.tag }}
          fileName: "quickgestures-*.zip"

      - name: Download release asset (latest)
        if: inputs.tag == ''
        uses: robinraju/release-downloader@v1.13
        with:
          latest: true
          fileName: "quickgestures-*.zip"

      - name: Select package
        id: package
        run: |
          shopt -s nullglob
          ZIPS=(quickgestures-*.zip)
          if [ ${#ZIPS[@]} -ne 1 ]; then
            echo "::error::Expected exactly one quickgestures-*.zip, found ${#ZIPS[@]}: ${ZIPS[*]}"
            exit 1
          fi
          echo "file=${ZIPS[0]}" >> "$GITHUB_OUTPUT"
          echo "Package: ${ZIPS[0]}"

      - name: Install chrome-webstore-upload-cli
        run: npm i -g chrome-webstore-upload-cli@4.0.2

      - name: Upload package
        run: |
          chrome-webstore-upload upload \
            --source "${{ steps.package.outputs.file }}" \
            --extension-id "$EXTENSION_ID"

      - name: Submit for review
        if: inputs.target == 'review'
        run: |
          if ! RESULT=$(chrome-webstore-upload publish --extension-id "$EXTENSION_ID" 2>&1); then
            echo "$RESULT"
            if echo "$RESULT" | grep -qi "privacy"; then
              echo "::error::Privacy practices are incomplete. Fill in the Privacy practices tab in the Developer Dashboard: https://chrome.google.com/webstore/devconsole"
            else
              echo "::error::Submitting for review failed. The upload succeeded and stays as a draft; check the Developer Dashboard."
            fi
            exit 1
          fi
          echo "$RESULT"

      - name: Summary
        if: success()
        run: |
          {
            echo "### Chrome Web Store"
            echo "- Package: \`${{ steps.package.outputs.file }}\`"
            echo "- Release: ${TAG:-latest}"
            if [ "$TARGET" = "review" ]; then
              echo "- Submitted for review; it goes live automatically after approval."
            else
              echo "- Uploaded as a draft. Submit it from https://chrome.google.com/webstore/devconsole"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
