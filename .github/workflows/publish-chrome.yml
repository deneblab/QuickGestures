name: Publish to Chrome Web Store

# Manual only. Releases HEAD of the chosen branch (or reuses its existing release) and
# submits that package for review; skipped when the version is already live or in review.
# A "release" trigger would never fire: events from GITHUB_TOKEN do not start other workflows.
on:
  workflow_dispatch:

permissions:
  contents: write

# Shared with release.yml: both create releases and tags
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/build/*.csproj', 'src/build/Directory.Build.props', 'global.json') }}

      - name: Release and publish to Chrome Web Store
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: ./build.sh PublishStore
