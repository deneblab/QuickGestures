name: Release

on:
  push:
    branches:
      - "production"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.11); empty = calculated by abcversion"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build, package and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          ARGS=(Release)
          if [ -n "$VERSION" ]; then
            ARGS+=(--version-override "$VERSION")
          fi
          ./build.sh "${ARGS[@]}"
