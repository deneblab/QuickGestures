name: Release

on:
  push:
    branches:
      - "production"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.11); empty = calculated by abcversion"
        required: false
        type: string

permissions:
  contents: write

# Shared with publish-chrome.yml: both create releases and tags
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/build/*.csproj', 'src/build/Directory.Build.props', 'global.json') }}

      - name: Build, package and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          ARGS=(Release)
          if [ -n "$VERSION" ]; then
            ARGS+=(--version-override "$VERSION")
          fi
          ./build.sh "${ARGS[@]}"
