<!doctype html>
<html><head><meta charset="utf-8"><title>QuickGestures small promo tile</title>
<style>
  html,body{margin:0;width:440px;height:280px;overflow:hidden}
  body{display:flex;align-items:center;gap:22px;padding:0 30px;box-sizing:border-box;
    background:linear-gradient(135deg,#1f3a5f 0%,#1E90FF 100%);color:#fff;
    font-family:"Noto Sans",system-ui,sans-serif}
  .icon{flex:none;width:132px;height:132px;background:#fff;border-radius:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .icon img{width:108px;height:108px}
  h1{margin:0 0 8px;font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-.5px}
  p{margin:0;font-size:17px;line-height:1.3;opacity:.95}
  .arrows{margin-top:14px;font-size:22px;letter-spacing:6px;opacity:.9}
</style></head>
<body>
  <div class="icon"><img src="icon.png" alt=""></div>
  <div>
    <h1>Quick<br>Gestures</h1>
    <p>Navigate with your mouse</p>
    <div class="arrows">&#x2B05; &#x27A1; &#x2B06; &#x2B07;</div>
  </div>
</body></html>
